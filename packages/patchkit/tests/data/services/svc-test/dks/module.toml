[module]
id = "core/services/svc-test"
# The version the file provides (PROVIDES), as tests/fixtures/modules/svc-test: 0.8.2 meets a need of the svc-test imports.
version = "0.8.2"
name = "svc-test service (C and assembler sources)"
# not `core`: the object is build output (the cache), never written into this directory
category = "test"
role = "service"
service = "svc-test"
type = "raw"
author = "digikit"
status = "experimental"
summary = "Test fixture: the test-only service svc-test as a service file whose Rust object links a C and an assembler source; the hook is a C function"
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# The hook is a routine of a C source of the object (`../csrc/hook.c`), not assembler in `src/hooks.rs`.
[[hook]]
name = "cf.menu.hook.settings_list.tail"
entry = "svc_test_settings_tail"

# The crate, then a C and an assembler source outside dks/: compiled as adapter sources (C with -DDK_SERVICE=1), with the directory of their header in
# place of dks/build/gen and dks/src, and linked with the crate, which keeps what its exports reach (`patchkit build`).
[[object]]
path = "build/svc-test.dko.json"
sources = ["Cargo.toml", "../csrc/hook.c", "../csrc/exports.s"]
include_dirs = ["../csrc/include"]
place = "cf.expansion"
