<text x="352" y="451" class="caption" font-weight="bold">Input and performance gestures</text>
<text x="352" y="476" class="note">H: input overlay · H / NO: return</text>
<text x="352" y="497" class="note">TRIG: toggle · FUNC + TRIG: select one</text>
<text x="352" y="518" class="note">TRIG + LEVEL: source capture gain</text>
<text x="352" y="539" class="note">A: OFF/L/R/ST · B: external gain</text>
<text x="352" y="560" class="note">YES: arm/cancel · FUNC + NO: clear</text>
<text x="20" y="622" class="note">UP/DOWN: PRISM pages · FUNC + FX: next effect · LEVEL/DATA: LIVE ↔ processed phrase</text>
<text x="20" y="642" class="note">System monospace text and original vector shapes. No extracted assets are embedded.</text>
</svg>
