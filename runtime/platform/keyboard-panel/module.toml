[module]
id = "core/keyboard-panel"
version = "0.1.0"
name = "Keyboard panel"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "stable"
summary = "The KEYBOARD view of the panel for the track keyboard: key down and up, retrig, recording and step entry, offered to core/track-keyboard, which plays CANOPY's tracks too."
requires = ["core/runtime"]
conflicts = []
ports = ["dt2-1.17"]

[targets]
"dt2-1.17" = "stable"

# panel.c is the KeyboardView handler that core/instrument-play had (docs/plans/fork-image-diet.md section 9). It runs in the image, so the
# track keyboard plays and records without CANOPY, and it calls nothing of CANOPY's host: the track keyboard plays CANOPY's tracks too.
# src-clock.c is the pure SRC clock that core/relay-track and the service read too.
[[object]]
path = "build/keyboard-panel-cf.dko.json"
sources = ["src/cf/panel.c", "src/cf/panel.s", "src/cf/src-clock.c"]
place = "cf.expansion"
devices = ["dt2"]
optional = ["tk_capture_note_list_commit", "tk_capture_panel_press", "tk_capture_panel_release", "tk_panel_cancel", "tk_panel_focus", "tk_panel_native_record_on", "tk_panel_off", "tk_panel_on", "tk_panel_record_audition", "tk_panel_retrig", "tk_panel_trig_on"]

[object.externs]
ip_panel_active = "cf.page.site.instrument_panel_active"
ip_panel_key_down = "cf.input.fn.key_down"
ip_panel_live_record = "cf.page.site.instrument_live_record"
ip_panel_project_settings = "cf.project.fn.settings"
ip_panel_selected_track = "cf.page.site.instrument_panel_selected_track"
ip_panel_step_record = "cf.page.site.instrument_step_record"
ip_panel_stock_detach = "cf.page.site.instrument_panel_detach"
ip_panel_stock_key = "cf.page.site.instrument_panel_key"
ip_panel_stock_toggle = "cf.page.site.instrument_panel_toggle"
ip_panel_track_object = "cf.page.site.instrument_panel_track_object"
ip_panel_track_type = "cf.page.site.instrument_panel_track_type"
ip_panel_trig_held = "cf.page.site.instrument_trig_held"
ip_panel_trig_mode = "cf.page.fn.instrument_panel_trig_mode"
ip_panel_trig_return = "cf.page.site.instrument_panel_trig_return"
ip_panel_on_resume = "hook.cf.page.site.instrument_panel_on.return"
ip_panel_off_resume = "hook.cf.page.site.instrument_panel_off.return"
ip_note_list_resume = "hook.cf.page.site.instrument_note_list_write.return"


[[op]]
op = "write"
anchor = "cf.page.site.instrument_panel_toggle_call"
offset = 2
value = "ip_panel_toggle"
width = 4

[[op]]
op = "hook"
hook = "cf.page.hook.instrument_panel_on"
to = "ip_panel_on"

[[op]]
op = "hook"
hook = "cf.page.hook.instrument_panel_off"
to = "ip_panel_off"

[[op]]
op = "hook"
hook = "cf.page.hook.instrument_note_list_write"
to = "ip_note_list_write"

[[op]]
op = "write"
anchor = "cf.page.site.instrument_panel_key_slot"
value = "ip_panel_key_event"
width = 4

[[op]]
op = "write"
anchor = "cf.page.site.instrument_panel_detach_slot"
value = "ip_panel_detach"
width = 4

[[op]]
op = "write"
anchor = "cf.page.site.instrument_panel_update_slot"
value = "ip_panel_update"
width = 4
