[module]
id = "core/relay-track"
version = "0.3.0"
name = "RELAY track recorder"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Track-owned stereo tapes with compact and expanded waveform views."
ports = ["dt2-1.17"]
requires = ["core/relay-input", "core/relay-storage", "core/instrument-play", "core/loop-control", "core/fxview", "core/plusdrive-write"]
# RELAY's ColdFire code is services/relay.dks: a module that requires this adapter (RELAY's machine) needs the file
served_by = "relay"
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# services/relay.dks fills the slot word with its vector table (`relay_vec_table`); the forwarders of seam.s read it and run without
# RELAY while it is 0. The service reads the image table `relay_image` (seam-table.s) at setup. Both are generated from
# services/relay/seam.toml.
[[slot]]
name = "relay_vec"

[[info]]
name = "relay_image"

# The image keeps RELAY's DSP objects (below), its parameter entries, the seam and the two block-interrupt paths of image.c (an idle
# frame and the stock frame unchanged), because core/dsp-link reserves RELAY's frame words whenever this adapter is in the image.
# The recorder, the SRC pages, the tape files and the Sound association of tapes (control.c, files.c) are C of this directory
# compiled into the service file.
[[object]]
path = "build/track-cf.dko.json"
sources = ["src/image.c", "src/seam.s", "src/seam-table.s"]
place = "cf.expansion"
devices = ["dt2"]
# the registry codes of the MOD destinations, which the image table hands to the service (`RT_VALUE`)
[object.externs]
rtm_mod_rate = "params.rtm_mod_rate.index"
rtm_mod_spacing = "params.rtm_mod_spacing.index"
rtm_mod_feedback = "params.rtm_mod_feedback.index"
rtm_mod_mix = "params.rtm_mod_mix.index"
rtm_mod_gain = "params.rtm_mod_gain.index"
rtm_mod_position = "params.rtm_mod_position.index"

[[object]]
path = "build/track-dsp.dko.json"
sources = ["src/dsp/engine.s", "src/dsp/bridge.s", "src/dsp/capture.s", "src/dsp/audio.s"]
place = "dsp.l2"
devices = ["dt2"]
optional = ["_tk_pool_head_owner"]
[object.externs]
_rtm_bus = "dsp.fx.value.send.track_bus"
_rtm_mod_frame = "dsp.voice.value.frame_base"

[[entry]]
registry = "params"
id = "rtm_mod_rate"
name = "Tape rate"
short = "RATE"
template = 0xd1
slot = 1
min = 0
max = 0x7f00
default = 0x4000

[[entry]]
registry = "params"
id = "rtm_mod_spacing"
name = "Head spacing"
short = "HEAD"
template = 0xd1
slot = 2
min = 0
max = 0x7f00
default = 0x4000

[[entry]]
registry = "params"
id = "rtm_mod_feedback"
name = "Feedback"
short = "FDBK"
template = 0xd1
slot = 3
min = 0
max = 0x7f00
default = 0x4000

[[entry]]
registry = "params"
id = "rtm_mod_mix"
name = "Tape mix"
short = "MIX"
template = 0xd1
slot = 4
min = 0
max = 0x7f00
default = 0x4000

[[entry]]
registry = "params"
id = "rtm_mod_gain"
name = "Input gain"
short = "GAIN"
template = 0xd1
slot = 5
min = 0
max = 0x7f00
default = 0x4000

[[entry]]
registry = "params"
id = "rtm_mod_position"
name = "Play position"
short = "POS"
template = 0xd1
slot = 6
min = 0
max = 0x7f00
default = 0x4000
