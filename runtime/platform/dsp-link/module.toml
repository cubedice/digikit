[module]
id = "core/dsp-link"
version = "0.1.0"
name = "DSP link"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Sends code and data to the DSP while it runs, through the unused end of the ColdFire's block frame."
ports = ["dt2-1.17", "dn2-1.12"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"
"dn2-1.12" = "experimental"

# Constants of the DSP objects (tail geometry, area size) from the device files, written by `patchkit gen`.
[[gen]]
kind = "sharc"
path = "build/gen/device-{dev}.inc"
uses = ["DL_AREA_BYTES", "DL_AREA_WORDS", "DL_TAIL_OFF", "DL_TAIL_WORDS"]

# The contract's maximum area (the link's 17-bit word offset), a C header for the ColdFire object that both devices share.
[[gen]]
kind = "c-shared"
path = "build/gen/dl-limits.h"

# ColdFire: the hook on the frame sender and the sender's state (both devices; the anchors differ per device).
[[object]]
path = "build/dsp-link-cf.dko.json"
sources = ["src/cf/dsp-link.c", "src/cf/tramp.s", "src/cf/forward.c"]
optional = ["pp_write_frame", "instrument_write_frame", "instrument_write_lock_frame", "phrase_write_frame", "loop_reply_frame", "relay_reply_frame", "relay_write_frame", "rtm_gate_frame", "tk_pool_link_project", "tk_pool_link_write", "tk_pool_link_reply"]
place = "cf.expansion"

[object.externs]
dl_stock_send = "cf.link.fn.frame"
dl_tx_lit = "cf.link.site.tx_queue_lit"
dl_rec_lit = "cf.link.site.reply_copy_lit"

[[object]]
path = "build/dsp-link-dt2.dko.json"
sources = ["src/dsp/dt2.s"]
place = "dsp.l2"
devices = ["dt2"]
# window 1 and window 2 (row registries a module of the image binds to a window with `window = N` in its `[[registry]]`; base and row count); 0 when no registry is registered
optional = ["_dl_win1_base", "_dl_win1_rows", "_dl_win2_base", "_dl_win2_rows", "_dv_diag", "_dv_rec", "_fx_diag", "_fx_rec", "_dl_irows", "_dl_iwords", "_pattern_position_info", "_loop_ui_status", "_instrument_reply", "_iv_lock_stage", "_phrase_control_info", "_phrase_reply", "_relay_status", "_relay_request", "_relay_response", "_tk_pool_receive", "_tk_pool_quiet_reply"]
# the fork: window 4 (the instrument rows of core/instrument-play, `_dl_irows`/`_dl_iwords`) and the optional words the fork's adapters export

[object.externs]
_dl_back = "hook.dsp.link.site.block_tail.tail"
_dl_win1_base = "window1.rows"
_dl_win1_rows = "window1.count"
_dl_win2_base = "window2.rows"
_dl_win2_rows = "window2.count"

[[object]]
path = "build/dsp-link-dn2.dko.json"
sources = ["src/dsp/dn2.s"]
place = "dsp.l2"
devices = ["dn2"]
# window 1 and window 2 (row registries a module of the image binds to a window with `window = N` in its `[[registry]]`; base and row count); 0 when no registry is registered
# `_dl_tail_chain`: block work another DSP object chains onto the end of the tail; 0 when none is in the image
optional = ["_dl_win1_base", "_dl_win1_rows", "_dl_win2_base", "_dl_win2_rows", "_dv_diag", "_dv_rec", "_fx_diag", "_fx_rec", "_dl_tail_chain", "_dl_irows", "_dl_iwords"]

[object.externs]
_dl_back = "hook.dsp.link.site.block_tail.tail"
_dl_win1_base = "window1.rows"
_dl_win1_rows = "window1.count"
_dl_win2_base = "window2.rows"
_dl_win2_rows = "window2.count"

[[op]]
op = "hook"
hook = "cf.link.hook.block_isr.frame_call"
to = "dl_frame_hook"

[[op]]
op = "hook"
hook = "dsp.link.hook.block_tail"
to = "_dl_hook"

[[claim]]
resource = "dsp.link.site.block_tail"

[[claim]]
resource = "cf.link.site.block_isr.frame_call"
