[package]
name = "dkrt-sdk"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

# dkneeds has no dependencies and builds for ColdFire; it holds the format rules of a V2 instrument section (dkneeds::instrument).
[dependencies]
dkneeds = { path = "../../../../packages/dkneeds" }

[dev-dependencies]
dkneeds = { path = "../../../../packages/dkneeds", features = ["fixtures"] }

