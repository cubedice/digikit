# Selective phrase routing, DTII OS1.17. References are hash-relative; the
# module contains no vendor instructions or firmware bytes.

[[fn]]
name = "dsp.phrase.fn.send_entry"
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_func", reloc_hash = "fa1a20f99b38800e86908e78c57bf944edd86a45b60ed6f20fe24c7fe19e9c44", offset = 0, len = 6 }
mark = "V"
users = ["core/phrase-route"]
doc = "Native sends driver entry, after track rendering and before native send inputs: R8 points to two raw external-input channel pointers."

[[site]]
name = "dsp.phrase.site.send_first"
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_func", reloc_hash = "fa1a20f99b38800e86908e78c57bf944edd86a45b60ed6f20fe24c7fe19e9c44", offset = 0x60, len = 6 }
mark = "V"
users = ["core/phrase-route"]
doc = "Native sends track zero source pointer, I4=track bus; replace with the private scaled bus."

[[site]]
name = "dsp.phrase.site.send_tracks"
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_func", reloc_hash = "fa1a20f99b38800e86908e78c57bf944edd86a45b60ed6f20fe24c7fe19e9c44", offset = 0x12a, len = 6 }
mark = "V"
users = ["core/phrase-route"]
doc = "Native sends tracks1..15 source address addition; incoming I0 is track byte offset, add the private scaled base."

[[site]]
name = "dsp.phrase.site.master_tracks"
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_func", reloc_hash = "cd922cc4821f7d3912560bd7e559ebe263957a4e55d8a784b0ce16bf06dd7454", offset = 0x6f, len = 6 }
mark = "V"
users = ["core/phrase-route"]
doc = "Master track base I13; redirect only the master reader to the private track mirror, and add validated phrase wet output before FX-return mixing."

[[value]]
name = "dsp.phrase.value.main_exclude"
cpu = "sharc"
devices = ["dt2"]
rule = { kind = "sharc_mem_addr", reloc_hash = "cd922cc4821f7d3912560bd7e559ebe263957a4e55d8a784b0ce16bf06dd7454", offset = 0x6c }
mark = "V"
users = ["core/phrase-route"]
doc = "Native main exclusion mask: bits0..15 skip track contribution in the master; capture observes those track exclusions. External capture is independent of monitoring."

[[hook]]
name = "dsp.phrase.hook.send_entry"
site = "dsp.phrase.fn.send_entry"
cpu = "sharc"
mode = "before"
regs = { in = ["r8"], clobbers = ["r8", "astat"] }
devices = ["dt2"]
mark = "D"
users = ["core/phrase-route"]
doc = "Run the exclusive phrase owner before native sends, retaining original tracks and raw input while substituting a private raw-input pointer pair."

[[hook]]
name = "dsp.phrase.hook.send_first"
site = "dsp.phrase.site.send_first"
cpu = "sharc"
mode = "replace"
regs = { in = [], clobbers = ["i4"] }
devices = ["dt2"]
mark = "D"
users = ["core/phrase-route"]
doc = "Replace the first track pointer with the private dry/send bus."

[[hook]]
name = "dsp.phrase.hook.send_tracks"
site = "dsp.phrase.site.send_tracks"
cpu = "sharc"
mode = "replace"
regs = { in = ["i0"], clobbers = ["i0", "astat"] }
devices = ["dt2"]
mark = "D"
users = ["core/phrase-route"]
doc = "Replace the native trackbase addition with the private dry/send base."

[[hook]]
name = "dsp.phrase.hook.master_tracks"
site = "dsp.phrase.site.master_tracks"
cpu = "sharc"
mode = "replace"
regs = { in = [], clobbers = ["i13", "astat"] }
devices = ["dt2"]
mark = "D"
users = ["core/phrase-route"]
doc = "Add phrase wet to the completed native return and replace the master-only track base."
