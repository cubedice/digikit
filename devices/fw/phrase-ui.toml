devices = ["dt2"]
mark = "D"
users = ["core/phrase-ui"]
doc = "Wrap the normal cdecl LED setter; the handler invokes the generated callable tail. Only TRIG LEDs 26..41 change while phrase input selection owns the view; every other LED and all normal-view calls are retained."

