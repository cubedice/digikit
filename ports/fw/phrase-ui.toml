# The TRIG keys and LEDs of the phrase page while G holds the selection of the tracks. Restored from the input overlay that
# step 2 of the PRISM redesign removed (git 98409b9ad); the windows, hashes and port entries are the ones it ran with.
[[site]]
name = "cf.page.site.phrase_led_set"
cpu = "cf"
devices = ["dt2"]
rule = { kind = "cf_window_hash", search_len = 32, offset = 0, len = 8, sha256 = "4b295b76d2e45d653b51a0a47899dde156277fd97d73331ef479e3e01202f80a" }
mark = "V"
users = ["core/fxview"]
doc = "DTII OS1.17 LedManager setter entry. cdecl(manager, logical, layer, value). First eight bytes contain complete stack allocation and register-save instructions. Native layer priorities reset on each LED frame."

[[hook]]
name = "cf.page.hook.phrase_led_set"
site = "cf.page.site.phrase_led_set"
cpu = "cf"
mode = "before"
regs = { in = [], clobbers = ["d0-d1", "a0-a1", "ccr"] }
devices = ["dt2"]
mark = "D"
users = ["core/fxview"]
doc = "Wrap the normal cdecl LED setter; the handler invokes the generated callable tail. The FX adapter lets the front picker claim TRIG and page LEDs at native layer 2; otherwise the call is retained."

[[site]]
name = "cf.page.site.phrase_key_walk"
cpu = "cf"
devices = ["dt2"]
rule = { kind = "cf_func", hash = "e741aa3500a20d22aa97ee402dcf9e43", offset = 0x8, len = 8 }
mark = "V"
users = ["core/fxview"]
was = ["cf.page.site.phrase_key_dispatch"]
doc = "The first two instructions after the prologue of the key walker (`cf.input.site.key_event_walk`, DT2 0x4011c79c; this site 0x4011c7a4): `move.l (0x68,SP),D2; movea.l (0x64,SP),A2` (8 bytes, no PC-relative form, no branch lands inside). Here SP is the walker's frame (0x60 bytes, D2-D7/A2-A6 saved at 0(SP)), 0x64(SP) = the ViewController, 0x68(SP) = the KeyEvent (+0xc code, +0x10 flags). The walker entry itself is upstream's (core/services/shortcuts hooks it through the port file, which refuses a site an image module patched): core/fxview took the entry before the upstream merge of 2026-11-24."

[[hook]]
name = "cf.page.hook.phrase_key_walk"
site = "cf.page.site.phrase_key_walk"
cpu = "cf"
mode = "replace"
regs = { in = [], clobbers = ["ccr"] }
devices = ["dt2"]
mark = "D"
users = ["core/fxview"]
was = ["cf.page.hook.phrase_key_dispatch"]
doc = "Offer numbered TRIG presses to the front picker before stock grid processing, and retain the resulting releases; a note-step picker also owns PAGE. The routine is jumped to with the walker's frame. Pass: replay the two displaced moves and jump to the end of the site (D0, D1, A0 and A1 kept). Consume: restore D2-D7/A2-A6 from the frame, drop it, `moveq #1,%d0; rts` (the walker returns true: no release callback, no view sees the event). Runs after core/services/shortcuts, which has the walker entry."
