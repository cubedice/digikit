# DTII 1.17 native trig clipboard and editor entry points.

[[site]]
name = "cf.track_steps.site.copy"
cpu = "cf"
devices = ["dt2"]
rule = { kind = "cf_window_hash", search_len = 24, offset = 0, len = 8, sha256 = "02f31e012cb104dfb6583a48ecfb8275e645a00fc5c519ae1df650a8ece62f7f" }
mark = "D"
users = ["core/track-keyboard"]
doc = "Copy native trigs from the selected steps to the clipboard."

[[hook]]
name = "cf.track_steps.hook.copy"
site = "cf.track_steps.site.copy"
cpu = "cf"
devices = ["dt2"]
mode = "replace"
regs = { in = [], clobbers = ["d0-d1", "a0-a1", "ccr"] }
mark = "D"
users = ["core/track-keyboard"]
doc = "Pair the native operation with the attached step settings."

