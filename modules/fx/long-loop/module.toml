[module]
id = "michael/long-loop"
version = "0.1.0"
name = "Long loop proof"
category = "fx"
type = "fx"
author = "Michael"
status = "experimental"
summary = "Captures one second of stereo master audio in owned storage and crossfades with the live mix."
dynamic = true
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "build/long-loop-dsp.dko.json"
sources = ["src/dsp/long_loop.s"]
place = "dsp.l2"
devices = ["dt2"]


[[object]]
path = "build/long-loop-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"
