[module]
id = "michael/short-loop"
version = "0.1.0"
name = "Short loop proof"
category = "fx"
type = "fx"
author = "Michael"
status = "experimental"
summary = "Captures 250 ms of stereo master audio, freezes it, and crossfades with the live mix."
dynamic = true
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "build/short-loop-dsp.dko.json"
sources = ["src/dsp/short_loop.s"]
place = "dsp.l2"
devices = ["dt2"]


[[object]]
path = "build/short-loop-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"
