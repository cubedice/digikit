[module]
id = "michael/bar-loop"
version = "0.2.0"
name = "Bar loop proof"
category = "fx"
type = "fx"
author = "Michael"
status = "experimental"
summary = "Arms at a selected pattern step, records a chosen step count once, and crossfades the frozen stereo loop."
dynamic = true
ports = ["dt2-1.17"]
requires = []
conflicts = []

[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "build/bar-loop-dsp.dko.json"
sources = ["src/dsp/bar_loop.s"]
place = "dsp.l2"
devices = ["dt2"]


[[object]]
path = "build/bar-loop-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"
