[module]
id = "digikit/overloop"
version = "0.4.0"
name = "Overloop"
category = "fx"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Arms at a selected pattern step, records a chosen step count once, and crossfades the frozen stereo loop."
dynamic = true
ports = ["dt2-1.17"]
# The DSP reads the loop buffer (core/loop-storage) and the pattern position (core/pattern-position); the knob handoff and the
# display are core/loop-controls and core/loop-display, which require the position adapter.
requires = ["core/loop-storage", "core/loop-display"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# The effect, declared by builder calls in init (src/module.c); its DSP symbols are _bl_process and _bl_desc.
[[fx]]
id = "loop"
dsp = "bl"

[[object]]
path = "build/overloop-dsp.dko.json"
sources = ["src/dsp/overloop.s"]
place = "dsp.l2"
devices = ["dt2"]

[[object]]
path = "build/overloop-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

# One effect record (0x1a4, its page and params inline) after the 16-byte header: no machine, param or page rows.
[uses.dt2]
machine_rows = 0
param_rows = 0
page_rows = 0
record_bytes = 436
