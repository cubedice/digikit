[module]
id = "digikit/prism"
version = "0.1.0"
name = "PRISM"
category = "fx"
type = "fx"
author = "digikit"
status = "experimental"
summary = "Stereo repeater on one tape: zones, repeats, colour, halo, skew, flip and hold."
dynamic = true
ports = ["dt2-1.17"]
# The DSP imports the control mailbox and the status mailbox of core/phrase-control and the lease of core/loop-storage (it uses the
# first bank). The control words are version 3 (sdk/dsp/contract/dk_phrase.inc): core/phrase-control publishes them and
# core/phrase-ui shows them on the effect's one page. PRISM is a send effect of the effect framework: its input is the tracks
# by their PRS send amounts, its output goes to the FX return.
requires = ["core/phrase-ui"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

# The effect, declared by builder calls in init (src/module.c); its DSP symbols are _prism_process and _prism_desc.
[[fx]]
id = "prism"
dsp = "prism"

[[object]]
path = "build/prism-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

[[object]]
path = "build/prism-dsp.dko.json"
sources = ["src/dsp/prism.s", "src/dsp/heads.s", "src/dsp/loop.s", "src/dsp/halo.s"]
place = "dsp.l2"
devices = ["dt2"]

# The load cell boots the patch set with the phrase adapters. The rig's effect suite does not run the effect: its DSP reads the
# control mailbox of core/phrase-control and the bank of core/loop-storage, which the suite does not place; tests/engine.rig.test.ts
# runs the engine on the rig with stand-ins for both (tests/provider.s) and holds every block to dsp_cost_fx of [uses.dt2].
[conformance]
patch_set = "phrase"
rig_skip = "reads core/phrase-control and core/loop-storage data the rig does not place"

# One effect record (0x1a4, its page inline) after the 16-byte header: no machine, param or page rows.
# dsp_cost_fx: the costliest hook call (core/fx and the effect) of the cases in tests/engine.rig.test.ts, in instructions.
[uses.dt2]
machine_rows = 0
param_rows = 0
page_rows = 0
record_bytes = 436
dsp_cost_fx = 19292
