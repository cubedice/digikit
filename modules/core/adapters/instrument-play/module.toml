[module]
id = "core/instrument-play"
version = "0.1.0"
name = "Persistent instrument playback"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Single-instance V2 transport, development admission policy and shared carrier."
requires = ["core/instrument-registry", "core/dsp-voice", "core/dynreg", "core/dyndsp", "core/ui"]
conflicts = ["test/canopy-carrier", "test/canopy-transport", "test/instrument-load"]
ports = ["dt2-1.17"]
[targets]
"dt2-1.17" = "experimental"
[[object]]
path = "build/play-dsp.dko.json"
sources = ["src/dsp/play.s", "src/dsp/reset-protected.s", "src/dsp/carrier.s"]
place = "dsp.l2"
devices = ["dt2"]
[object.externs]
_mi_workspace_next = "dsp.voice.site.envelope_workspace.next"
_mi_envelope_next = "dsp.voice.site.envelope_entry.next"
_mi_velocity_next = "dsp.voice.site.velocity_operand.next"
[[op]]
op = "hook"
hook = "dsp.voice.hook.envelope_workspace"
to = "_mi_workspace_entry"
[[op]]
op = "hook"
hook = "dsp.voice.hook.envelope_entry"
to = "_mi_envelope_entry"
[[op]]
op = "hook"
hook = "dsp.voice.hook.velocity_operand"
to = "_mi_velocity_entry"

[[object]]
path = "build/play-cf.dko.json"
sources = ["src/cf/control.c", "src/cf/keyboard.c", "src/cf/preset.c", "src/cf/src-state.c", "src/cf/status.c", "src/cf/src-display.c", "src/cf/src-clock.c", "src/cf/src-native.c", "src/cf/sound.c", "src/cf/sound-load.s", "src/cf/view.s"]
place = "cf.expansion"
devices = ["dt2"]
[object.externs]
ip_view_next = "hook.cf.machine.fn.selection_build.tail"
ip_view_build = "cf.machine.fn.selection_build"
ip_project = "cf.project.fn.singleton"
ip_kit = "cf.project.fn.active_kit"
ip_refresh = "cf.machine.fn.refresh_track"
ip_sound_resume = "hook.cf.machine.site.sound_deserialize.return"
ip_src_type = "cf.machine.fn.current_track_type"
ip_src_track = "cf.page.site.instrument_src_track"
ip_src_alternate = "cf.page.site.instrument_src_alternate"
ip_src_stock_draw = "cf.page.site.instrument_src_draw"
ip_src_stock_update = "cf.page.site.instrument_src_update"
ip_src_stock_key = "cf.page.site.instrument_src_key"
ip_src_stock_turn = "cf.page.site.instrument_src_turn"
ip_src_stock_parameter = "cf.page.site.instrument_src_parameter"
ip_src_stock_event = "cf.page.site.instrument_src_event_dispatch"
ip_src_stock_attach = "cf.page.site.instrument_src_attach"
ip_src_stock_detach = "cf.page.site.instrument_src_detach"
ip_src_value = "cf.page.site.instrument_src_value"
ip_src_tune_format = "cf.page.site.instrument_src_tune_format"
ip_src_level_format = "cf.page.site.instrument_src_level_format"
[[op]]
op = "hook"
hook = "cf.machine.hook.sound_deserialize"
to = "ip_sound_entry"

[[op]]
op = "hook"
hook = "cf.machine.hook.selection_build"
to = "ip_view_entry"

# Replace only the relevant primary/interface entries, preserving RTTI and all
# other SourcePageView virtual methods. Stock handlers remain callable.
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_parameter_slot"
value = "ip_src_parameter"
width = 4
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_draw_slot"
value = "ip_src_draw"
width = 4
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_update_slot"
value = "ip_src_update"
width = 4
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_key_slot"
value = "ip_src_key"
width = 4
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_turn_slot"
value = "ip_src_turn"
width = 4
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_encoder_slot"
value = "ip_src_encoder_interface"
width = 4
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_event_call"
offset = 2
value = "ip_src_event"
width = 4
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_attach_slot"
value = "ip_src_attach"
width = 4
[[op]]
op = "write"
anchor = "cf.page.site.instrument_src_detach_slot"
value = "ip_src_detach"
width = 4
