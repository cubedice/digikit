[module]
id = "core/track-keyboard"
version = "0.1.0"
name = "Track keyboard and arpeggiator"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "stable"
summary = "Track keyboard, arpeggiator and TRIG pages for every audio and MIDI track; CANOPY tracks join in while CANOPY is loaded. Its player runs from services/track-keyboard.dks."
ports = ["dt2-1.17"]
requires = ["core/runtime", "core/pattern-position", "core/ui", "core/keyboard-panel", "core/copy-watch", "core/midi-events", "core/relay-input", "core/fxview"]
# Its player, pages and MIDI paths run from services/track-keyboard.dks (docs/plans/fork-image-diet.md section 9.2): a module
# that requires it needs the file.
served_by = "track-keyboard"
conflicts = []

[targets]
"dt2-1.17" = "stable"

# The runtime calls tk_runtime_init once per UI pass (an image tick). It is a forwarder of seam.s: the track keyboard starts once
# services/track-keyboard.dks is loaded and stays polled; the call returns at once after the first that succeeded, and at once
# while the file is not loaded.
[[info]]
name = "tick_track_keyboard"
symbol = "tk_runtime_init"
tick = true

# No card module needs the file, so the image asks the boot for it (the runtime looks up `boot_need_<service>`, `-` written `_`;
# the address is not read): the boot finds, plans and loads services/track-keyboard.dks whether or not a selected module names it.
[[info]]
name = "boot_need_track_keyboard"
symbol = "tk_image"

# services/track-keyboard.dks fills the slot word with its vector table (`tk_vec_table`); the forwarders of seam.s read it and take
# the stock path while it is 0. The service reads the image table `tk_image` (seam-table.s) at setup. Both are generated from
# modules/core/services/track-keyboard/seam.toml.
[[slot]]
name = "tk_vec"

[[info]]
name = "tk_image"

# The image keeps what the boot's project load and the stock firmware reach before a card service is bound: the pattern storage
# and its hook entries, the parameter and seed validators, the pool frame writer, the hook entries of the sequencer, MIDI and step
# paths (their calls into the player go through the forwarders), the TRIG title and the second interface slot (image.c). The
# player, the TRIG and KEYS pages, the MIDI routes, capture, the pool admission and the runtime are C of this directory compiled
# into the service file (modules/core/services/track-keyboard/dks).
[[object]]
path = "build/track-keyboard.dko.json"
optional = ["rtm_is_type", "cp_valid", "ilp_event_pair", "instrument_lock_source", "instrument_locked_sound", "instrument_src_track_keyboard", "instrument_track_keyboard_lanes", "instrument_track_keyboard_legacy", "instrument_track_keyboard_locked_note", "instrument_track_owned"]
sources = ["src/track-valid.c", "src/track-config.c", "src/track-pattern.c", "src/track-pattern-fw.c", "src/track-record.c", "src/track-pattern-hooks.s",
  "src/track-step-hooks.s", "src/track-midi-hooks.s", "src/track-sequence-hooks.s",
  "src/track-pool.c", "src/track-pool-fw.c", "src/track-pool-hooks.s", "src/trig-title.s", "src/image.c", "src/seam.s", "src/seam-table.s"]
place = "cf.expansion"
devices = ["dt2"]
[object.externs]
memcpy = "cf.util.site.memcpy"
memset = "cf.util.site.memset"
tk_trig_stock_key = "cf.page.site.track_trig_stock_key"
tk_trig_stock_draw = "cf.page.site.track_trig_stock_draw"
tk_trig_stock_turn = "cf.page.site.track_trig_stock_turn"
tk_trig_stock_title = "cf.page.site.track_trig_stock_title"
tk_trig_title_ctor = "cf.string.fn.std_string.ctor"
tk_trig_stock_parameter = "cf.page.site.track_trig_stock_parameter"
tk_fw_project = "cf.project.fn.singleton"
tk_fw_alloc = "cf.mem.fn.new"
tk_fw_free = "cf.mem.fn.free"
tk_pool_stock_dispatch_resume = "hook.cf.track_keys.site.audio_dispatch_entry.return"
tk_midi_wire_on_resume = "cf.track_keys.site.wire_on_resume"
tk_midi_wire_off_resume = "cf.track_keys.site.wire_off_resume"
tk_midi_on_tail = "hook.cf.track_keys.site.midi_target_on.tail"
tk_midi_on_return = "hook.cf.track_keys.site.midi_target_on.return"
tk_midi_off_tail = "hook.cf.track_keys.site.midi_target_off.tail"
tk_midi_off_return = "hook.cf.track_keys.site.midi_target_off.return"
tk_pattern_save_resume = "hook.cf.project.site.pattern_save.return"
tk_pattern_load_resume = "hook.cf.project.site.pattern_load.return"
tk_pattern_reset_resume = "hook.cf.project.site.pattern_reset.return"
tk_pattern_track_clear_tail = "hook.cf.project.site.track_clear.tail"
tk_step_copy_resume = "hook.cf.track_steps.site.copy.return"
tk_step_paste_resume = "hook.cf.track_steps.site.paste.return"
tk_step_clear_resume = "hook.cf.track_steps.site.clear.return"
tk_step_toggle_resume = "hook.cf.track_steps.site.toggle.return"
tk_step_clip_get_entry = "cf.track_steps.fn.clip_get"
tk_seq_audio_stage_resume = "cf.track_sequence.site.audio_stage_resume"
tk_seq_midi_stage_resume = "cf.track_sequence.site.midi_stage_resume"
tk_seq_audio_builder_return = "cf.track_sequence.site.audio_builder_return"
tk_seq_midi_builder_return = "cf.track_sequence.site.midi_builder_return"
tk_seq_audio_start_builder_return = "cf.track_sequence.site.audio_start_builder_return"
tk_seq_midi_start_builder_return = "cf.track_sequence.site.midi_start_builder_return"
tk_seq_start_copy_resume = "cf.track_sequence.site.start_copy_resume"
tk_seq_sync_start_copy_resume = "cf.track_sequence.site.sync_start_copy_resume"
tk_seq_audio_due_resume = "cf.track_sequence.site.audio_due_resume"
tk_seq_audio_due_skip = "cf.track_sequence.site.audio_due_skip"
tk_seq_midi_due_resume = "cf.track_sequence.site.midi_due_resume"
tk_seq_midi_due_skip = "cf.track_sequence.site.midi_due_skip"
tk_seq_capture_clock = "cf.track_sequence.site.capture_clock"
tk_seq_capture_live_resume = "cf.track_sequence.site.capture_live_resume"

[[object]]
path = "build/track-pool-dsp.dko.json"
