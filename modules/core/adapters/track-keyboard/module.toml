[module]
id = "core/track-keyboard"
version = "0.1.0"
name = "Track keyboard and arpeggiator"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "stable"
summary = "Track keyboard, arpeggiator and TRIG pages for every audio and MIDI track; CANOPY tracks join in while CANOPY is loaded."
ports = ["dt2-1.17"]
requires = ["core/runtime", "core/pattern-position", "core/ui", "core/keyboard-panel", "core/copy-watch", "core/midi-events", "core/relay-input", "core/fxview"]
conflicts = []

[targets]
"dt2-1.17" = "stable"

# The runtime calls tk_runtime_init once per UI pass (an image tick): the track keyboard starts and stays polled without any
# module or service; the call returns at once after the first that succeeded.
[[info]]
name = "tick_track_keyboard"
symbol = "tk_runtime_init"
tick = true

[[object]]
path = "build/track-keyboard.dko.json"
optional = ["rtm_is_type", "cp_valid", "ilp_event_pair", "instrument_lock_source", "instrument_locked_sound", "instrument_src_track_keyboard", "instrument_track_keyboard_lanes", "instrument_track_keyboard_legacy", "instrument_track_keyboard_locked_note", "instrument_track_owned"]
sources = ["src/track-keyboard.c", "src/track-canopy.c", "src/track-config.c", "src/track-service.c", "src/track-runtime.c", "src/track-native.c", "src/track-native-fw.c", "src/trig-view.c", "src/trig-title.s",
  "src/track-pattern.c", "src/track-pattern-fw.c", "src/track-record.c", "src/track-pattern-hooks.s",
  "src/track-step-fw.c", "src/track-step-hooks.s",
  "src/track-midi.c", "src/track-midi-fw.c", "src/track-midi-hooks.s",
  "src/track-capture.c", "src/track-sequence.c", "src/track-sequence-fw.c", "src/track-sequence-hooks.s",
  "src/track-pool.c", "src/track-pool-fw.c", "src/track-pool-admission.c", "src/track-pool-hooks.s"]
place = "cf.expansion"
devices = ["dt2"]
[object.externs]
memcpy = "cf.util.site.memcpy"
memset = "cf.util.site.memset"
tk_trig_stock_track = "cf.page.site.instrument_src_track"
tk_trig_stock_alloc = "cf.mem.fn.new"
tk_trig_stock_held = "cf.page.site.instrument_trig_held"
