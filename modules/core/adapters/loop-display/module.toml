[module]
id = "core/loop-display"
version = "0.2.0"
name = "Loop page"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "The loop effect's own page: the timeline, the crossfader on H and LEVEL, ARM on the press of H, FUNC + NO drops the loop."
# core/fxview owns the FX view's table slots and calls this page's loop_fxv_ functions; core/loop-control holds the values.
requires = ["core/fxview", "core/loop-control"]
conflicts = []
ports = ["dt2-1.17"]

[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "build/loop-display-cf.dko.json"
sources = ["src/model.c", "src/native.c"]
place = "cf.expansion"
devices = ["dt2"]

[object.externs]
loop_stock_update = "cf.page.site.fx_update_entry"

# The FX view's update call: the page asks for a repaint when the engine's status has moved on.
[[op]]
op = "write"
anchor = "cf.page.site.fx_update_slot"
offset = 0
value = "loop_view_update"
width = 4
devices = ["dt2"]

[[claim]]
resource = "cf.page.site.fx_update_slot"
