[module]
id = "core/loop-display"
version = "0.1.0"
name = "Loop performance display"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "DTII Overloop performance display and coherent DSP status return."
requires = ["core/fxpages", "core/dsp-link", "core/loop-controls"]
conflicts = []
ports = ["dt2-1.17"]

[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "build/loop-display-cf.dko.json"
sources = ["src/display.c"]
place = "cf.expansion"
devices = ["dt2"]

[object.externs]
loop_reply_literal = "cf.link.site.reply_copy_lit"
loop_stock_update = "cf.page.site.fx_update_entry"

[[object]]
path = "build/loop-display-dsp.dko.json"
sources = ["src/dsp/status.s"]
place = "dsp.l2"
devices = ["dt2"]

[[op]]
op = "write"
anchor = "cf.page.site.fx_update_slot"
offset = 0
value = "loop_view_update"
width = 4
devices = ["dt2"]

[[claim]]
resource = "cf.page.site.fx_update_slot"
