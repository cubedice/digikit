[module]
id = "core/phrase-ui"
version = "0.1.0"
name = "Phrase FX page"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "The one page of the phrase effect: eight cells, MIX on LEVEL, FLIP, SYNC and HOLD on the encoder presses."
# core/fxview owns the FX view's table slots and calls this page's phrase_fxv_ functions.
requires = ["core/phrase-control", "core/fxview", "core/ui"]
conflicts = []
ports = ["dt2-1.17"]

[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "build/phrase-ui-cf.dko.json"
sources = ["src/model.c", "src/render.c", "src/native.c"]
place = "cf.expansion"
devices = ["dt2"]

# The function the fx service file (`fx.dks`) calls: it has no link to the image and finds it by name in the info table.
[[info]]
name = "phrase_ui_tick"
symbol = "phrase_ui_tick"
devices = ["dt2"]
