[module]
id = "core/phrase-route"
version = "0.1.0"
name = "Selective phrase FX routing"
category = "core"
role = "adapter"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Pre-fade phrase capture and private dry/send buses, preserving original track and USB buses."
ports = ["dt2-1.17"]
requires = ["core/fx", "core/phrase-control", "core/loop-storage"]
conflicts = []

[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "build/phrase-route-dsp.dko.json"
sources = ["src/dsp/route.s"]
place = "dsp.l2"
devices = ["dt2"]

[object.externs]
_fx_table = "fx.rows"
_fxs_trackbus = "dsp.fx.value.send.track_bus"
_fxs_return = "dsp.fx.value.send.return_bus"
_phr_main_exclude = "dsp.phrase.value.main_exclude"
_phr_pre_back = "hook.dsp.phrase.fn.send_entry.tail"
_phr_first_back = "hook.dsp.phrase.site.send_first.return"
_phr_tracks_back = "hook.dsp.phrase.site.send_tracks.return"
_phr_master_back = "hook.dsp.phrase.site.master_tracks.return"

[[op]]
op = "hook"
hook = "dsp.phrase.hook.send_entry"
to = "_phr_pre"

[[op]]
op = "hook"
hook = "dsp.phrase.hook.send_first"
to = "_phr_first"

[[op]]
op = "hook"
hook = "dsp.phrase.hook.send_tracks"
to = "_phr_track_base"

[[op]]
op = "hook"
hook = "dsp.phrase.hook.master_tracks"
to = "_phr_master"

[[claim]]
resource = "dsp.phrase.native-send-entry"

[[claim]]
resource = "dsp.phrase.native-track-bases"

[[claim]]
resource = "dt2.phrase-route.owner"
