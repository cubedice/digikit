[package]
name = "dkrt-svc-instrument-dks"
version = "0.1.0"
edition = "2021"
publish = false
description = "The instrument service as a service file (.dks): the C of core/instrument-play and core/midi-events behind the glue of dkrt-svc-rt"

[lib]
crate-type = ["staticlib", "rlib"]
# the object holds the C and assembler of the adapters (module.toml): the host tests of that code are the adapters' own
test = false

[dependencies]
dkrt-abi = { path = "../../../runtime/abi" }
dkrt-sdk = { path = "../../../runtime/sdk" }
dkrt-svc-rt = { path = "../../../runtime/svc-rt" }

# This crate sits inside the repository's cargo workspace tree but is built on its own (`patchkit build`).
[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
debug = false
