# The seam between the image adapters core/instrument-play and core/midi-events and the service file services/instrument.dks
# (docs/plans/fork-image-diet.md). `tools/seam.py` generates every file that depends on it; `--check` fails when one is stale.
#
# A vector is a [[slot]] word of an image adapter. The adapter keeps one forwarder per entry: it reads the slot and jumps through
# word i of the table the service filled it with, or does `absent` while the slot is 0 (no service loaded): `rts`, `zero`
# (d0 = 0), `minus1` (d0 = -1) or `jmp:SYMBOL` (the stock handler or an image function, with the caller's arguments).
# Changing the order or the count changes the layout: bump `version`.
version = 1

[[vector]]
slot = "instrument_vec"
table = "instrument_vec_table"
adapter = "core/instrument-play"
image_file = "modules/core/adapters/instrument-play/src/cf/seam.s"
entries = [
    # called by the image code that stays (the Sound persistence path and the hook entries)
    ["instrument_mod_carrier", "jmp:ip_mod_carrier_absent"],
    ["instrument_sound_flush", "rts"],
    ["ip_lock_capture", "rts"],
    ["ip_sound_begin", "zero"],
    ["ip_sound_end", "rts"],
    # called by the runtime, the menu, core/machines, core/relay-track and core/track-keyboard
    ["instrument_play_tick", "rts"],
    ["instrument_play_faulted", "zero"],
    ["dk_app_instrument_module_settings", "zero"],
    ["dk_app_instrument_settings_rows", "rts"],
    ["instrument_mod_param", "jmp:ip_mod_param_absent"],
    ["instrument_write_lock_frame", "rts"],
    ["ilp_event_pair", "zero"],
    ["instrument_lock_source", "zero"],
    ["instrument_src_track_keyboard", "rts"],
    ["instrument_track_keyboard_lanes", "zero"],
    ["instrument_track_keyboard_legacy", "zero"],
    ["instrument_track_keyboard_locked_note", "zero"],
    ["instrument_track_owned", "zero"],
    ["ip_current_machine_sound", "zero"],
    ["ip_refresh_machine_track", "zero"],
    ["ip_src_draw_rotary", "rts"],
    ["ip_src_attach", "jmp:ip_src_stock_attach"],
    ["ip_src_detach", "jmp:ip_src_stock_detach"],
    ["ip_src_draw", "jmp:ip_src_stock_draw"],
    ["ip_src_event", "jmp:ip_src_stock_event"],
    ["ip_src_key", "jmp:ip_src_stock_key"],
    ["ip_src_parameter", "jmp:ip_src_stock_parameter"],
    ["ip_src_turn", "jmp:ip_src_stock_turn"],
    ["ip_src_update", "jmp:ip_src_stock_update"],
]

[[vector]]
slot = "midi_vec"
table = "midi_vec_table"
adapter = "core/midi-events"
image_file = "modules/core/adapters/midi-events/src/cf/seam.s"
entries = [
    # CANOPY's channel ledger: the router of the image part (mi_channel_message, image.c) asks it after the track keyboard
    ["mi_legacy_channel_message", "zero"],
    ["mi_dsp_reset_begin", "rts"],
    ["mi_registry_expect_session", "minus1"],
    ["mi_registry_reply", "minus1"],
    ["instrument_write_frame", "rts"],
]

[[vector]]
slot = "kbp_vec"
table = "kbp_vec_table"
adapter = "core/keyboard-panel"
image_file = "modules/core/adapters/keyboard-panel/src/cf/seam.s"
# The KEYBOARD view handler's calls into CANOPY's host: [image name, absent, service function]. Without the service a track is not
# CANOPY's, so the handler takes the path of any other track (the track keyboard's, or stock).
entries = [
    ["kbp_track_owned", "zero", "instrument_track_owned"],
    ["kbp_track_keyboard_routed", "zero", "instrument_track_keyboard_routed"],
    ["kbp_track_plays_keys", "zero", "instrument_track_plays_keys"],
    ["kbp_record_chord", "zero", "instrument_record_chord"],
    ["kbp_select_track", "rts", "instrument_select_track"],
    ["kbp_panel_key", "zero", "mi_panel_key"],
    ["kbp_panel_release", "rts", "mi_panel_release"],
    ["kbp_seq_mute", "rts", "mi_seq_mute"],
]

# The image table `instrument_image` of core/instrument-play (its [[info]]): what the service takes from the image. The service
# copies it at setup (refused without it: E_NO_REGISTRY) and reaches each function through a thunk of its own (a0 is clobbered,
# as a C call may), a data word through IP_DATA(name), a registry code through IP_VALUE(name).
[image]
info = "instrument_image"
symbol = "instrument_image"
magic = 0x49505331 # "IPS1"
# image functions the moved code calls (always present in an image with the adapter)
functions = [
    "cp_decode", "cp_encode", "cp_fm_defaults", "cp_valid", "cp_wavetable_defaults",
    "sr_decode", "sr_encode",
    "sa_get", "sa_put", "sa_seq", "sa_slot",
    # core/keyboard-panel (the KEYBOARD view handler): the recorded-chord tick and the step note reader
    "ip_panel_tick", "ip_panel_step_note",
    "ip_sa_ensure", "ip_sa_store", "ip_sa_tick",
    
    "dk_ui_core_handle",
    "dkrt_instrument_generation", "dkrt_instrument_type", "dkrt_irq_mask", "dkrt_irq_restore",
    "dkrt_settings_flush", "dkrt_settings_get", "dkrt_settings_put",
    "mf_src_register", "mf_src_unregister",
    "pp_current_pattern",
]
# functions of other adapters that may be missing from the image (0 then): the moved code tests IP_HAVE(name) before a call
optional = [
    "tk_capture_note_list_commit", "tk_capture_panel_press", "tk_capture_panel_release",
    "tk_panel_cancel", "tk_panel_focus", "tk_panel_native_record_on", "tk_panel_off", "tk_panel_on",
    "tk_panel_record_audition", "tk_panel_retrig", "tk_pattern_cleared", "tk_pattern_copied", "tk_runtime_init",
    "tk_midi_channel_message",
    "rtm_can_save", "rtm_mod_carrier", "rtm_mod_param", "rtm_src",
    "dl_reset_begin", "dl_reset_quiesce",
]
# addresses the moved code reads or compares with: image data, and a forwarder that a firmware table holds
# (instrument_src_tick finds the SRC page by its vtable draw entry, which is the image forwarder ip_src_draw)
data = ["pp_position", "ip_view", "ip_src_draw"]
# registry codes (the index of a params entry of the adapter)
values = [
    "ip_mod_color", "ip_mod_drift", "ip_mod_mix", "ip_mod_strum", "ip_mod_gate", "ip_mod_swing",
    "ip_mod_position", "ip_mod_scan_depth", "ip_mod_scan_rate", "ip_mod_timbre_env", "ip_mod_wtfm_depth", "ip_mod_wtfm_env",
    "ip_mod_fm_depth", "ip_mod_balance", "ip_mod_feedback", "ip_mod_fm_env", "ip_mod_fm_attack", "ip_mod_fm_release",
]
