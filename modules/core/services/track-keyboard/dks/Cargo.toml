[package]
name = "dkrt-svc-track-keyboard-dks"
version = "0.1.0"
edition = "2021"
publish = false
description = "The track keyboard service as a service file (.dks): the C of core/track-keyboard behind the glue of dkrt-svc-rt"

[lib]
crate-type = ["staticlib", "rlib"]
# the object holds the C and assembler of the adapter (module.toml): the host tests of that code are the adapter's own
test = false

[dependencies]
dkrt-abi = { path = "../../../runtime/abi" }
dkrt-sdk = { path = "../../../runtime/sdk" }
dkrt-svc-rt = { path = "../../../runtime/svc-rt" }
dkrt-svc-track-keyboard = { path = ".." }

# This crate sits inside the repository's cargo workspace tree but is built on its own (`patchkit build`).
[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
lto = false
codegen-units = 1
debug = false
