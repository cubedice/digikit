[module]
id = "core/services/track-keyboard"
version = "0.1.0"
name = "track keyboard service"
category = "core"
role = "service"
service = "track-keyboard"
type = "raw"
author = "digikit"
status = "stable"
summary = "The player of the track keyboard and arpeggiator (TRIG and KEYS pages, MIDI routes, capture, pool admission and its runtime), moved out of the image of core/track-keyboard; it fills its forwarding slot"
requires = ["core/track-keyboard"]
conflicts = []

[targets]
"dt2-1.17" = "stable"

# The slot word of the image adapter (docs/plans/fork-image-diet.md section 9.2): each forwarder of its seam.s reads the slot and
# jumps through word i of the table, so the image runs this code only while the file is loaded. The table and the forwarders are
# generated together from ../seam.toml (modules/core/services/instrument/tools/seam.py).
[[fill]]
slot = "tk_vec"
entry = "tk_vec_table"
devices = ["dt2"]

# Rust glue (src/lib.rs, src/seam.rs) with the C of the adapter that left the image, and the generated seam (src/seam.s: the vector
# table, the thunks into the image, the copy of the image table). The C stays where it was, so its host tests do not move; it is
# compiled with -DDK_SERVICE (src/tk-seam.h of core/track-keyboard reads the image table then). memcpy and memset are the
# object's own (compiler_builtins), not the firmware's.
[[object]]
path = "build/track-keyboard.dko.json"
sources = [
    "Cargo.toml",
    "../../../adapters/track-keyboard/src/track-keyboard.c",
    "../../../adapters/track-keyboard/src/track-canopy.c",
    "../../../adapters/track-keyboard/src/track-service.c",
    "../../../adapters/track-keyboard/src/track-runtime.c",
    "../../../adapters/track-keyboard/src/track-native.c",
    "../../../adapters/track-keyboard/src/track-native-fw.c",
    "../../../adapters/track-keyboard/src/trig-view.c",
    "../../../adapters/track-keyboard/src/track-step-fw.c",
    "../../../adapters/track-keyboard/src/track-midi.c",
    "../../../adapters/track-keyboard/src/track-midi-fw.c",
    "../../../adapters/track-keyboard/src/track-capture.c",
    "../../../adapters/track-keyboard/src/track-sequence.c",
    "../../../adapters/track-keyboard/src/track-sequence-fw.c",
    "../../../adapters/track-keyboard/src/track-pool-admission.c",
    "src/seam.s",
]
include_dirs = ["../../../adapters/track-keyboard/src"]
place = "cf.expansion"

# The firmware names of the moved C (the aliases core/track-keyboard used), as imports `patchkit bind` resolves for the user's firmware.
[object.externs]
tk_trig_stock_track = "cf.page.site.instrument_src_track"
tk_trig_stock_alloc = "cf.mem.fn.new"
tk_trig_stock_held = "cf.page.site.instrument_trig_held"
tk_trig_stock_live_record = "cf.page.site.instrument_live_record"
tk_trig_stock_mark_edited = "cf.page.site.instrument_lock_mark_edited"
tk_trig_focus_touch = "cf.page.site.instrument_focus_touch"
tk_trig_focus_active = "cf.page.site.instrument_focus_active"
tk_trig_label_font = "cf.page.site.instrument_label_font"
tk_trig_stock_key = "cf.page.site.track_trig_stock_key"
tk_trig_stock_draw = "cf.page.site.track_trig_stock_draw"
tk_trig_stock_turn = "cf.page.site.track_trig_stock_turn"
tk_trig_stock_parameter = "cf.page.site.track_trig_stock_parameter"
tk_fw_project = "cf.project.fn.singleton"
tk_fw_active_kit = "cf.project.fn.active_kit"
tk_fw_track_type = "cf.project.fn.track_type"
tk_fw_audio_dispatch = "cf.track_keys.fn.audio_dispatch"
tk_pool_fw_audio_queue = "cf.track_keys.fn.audio_queue_head"
tk_midi_wire_ports_lit = "cf.track_keys.site.wire_ports_lit"
