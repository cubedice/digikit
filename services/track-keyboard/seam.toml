# The seam between the image adapter core/track-keyboard and the service file services/track-keyboard.dks
# (docs/plans/fork-image-diet.md section 9.2). `services/instrument/tools/seam.py` generates every file that depends
# on it; `--check` fails when one is stale.
#
# The vector is the [[slot]] word tk_vec of core/track-keyboard. The adapter keeps one forwarder per entry: it reads the slot and
# jumps through word i of the table the service filled it with, or does `absent` while the slot is 0 (no service loaded): `rts`,
# `zero` (d0 = 0), `minus1` (d0 = -1) or `jmp:SYMBOL` (the stock handler, with the caller's arguments). Without the service the
# firmware runs stock: no ARP or KEYS page, no track keyboard, the stock step edits, MIDI routes and sequencer records.
# Changing the order or the count changes the layout: bump `version`.
version = 3

[output]
service_file = "services/track-keyboard.dks"
adapter = "core/track-keyboard"
image_table = "runtime/platform/track-keyboard/src/seam-table.s"
header = "runtime/platform/track-keyboard/src/tk-seam.h"
guard = "DK_TRACK_KEYBOARD_SEAM_H"
prefix = "TK"
copy = "tk_img"
service_asm = "dks/src/seam.s"
service_rs = "src/seam_gen.rs"

[[vector]]
slot = "tk_vec"
table = "tk_vec_table"
adapter = "core/track-keyboard"
image_file = "runtime/platform/track-keyboard/src/seam.s"
entries = [
    # the image tick ([[info]] tick_track_keyboard): starts the track keyboard once the service is loaded
    ["tk_runtime_init", "rts"],
    # the hook entries of the image (track-sequence-hooks.s, track-midi-hooks.s, track-pool-hooks.s): 0 takes the stock path
    ["tk_fw_seq_stage", "rts"],
    ["tk_fw_seq_stage_midi", "rts"],
    ["tk_fw_seq_start_stage", "rts"],
    ["tk_fw_seq_start_copy", "rts"],
    ["tk_fw_seq_audio_due", "zero"],
    ["tk_fw_seq_midi_due", "zero"],
    ["tk_fw_capture_native_live", "rts"],
    ["tk_midi_native_action", "zero"],
    ["tk_midi_routed_note", "rts"],
    ["tk_pool_fw_block_note", "zero"],
    # the step hooks (cf.track_steps.hook.*): the displaced stock prologue of track-step-hooks.s
    ["tk_step_copy", "jmp:tk_stock_step_copy"],
    ["tk_step_paste", "jmp:tk_stock_step_paste"],
    ["tk_step_clear", "jmp:tk_stock_step_clear"],
    ["tk_step_toggle", "jmp:tk_stock_step_toggle"],
    # the TRIG page vtable slots: the stock handlers (tk_trig_title stays image code, image.c turns the interface slot)
    ["tk_trig_key", "jmp:tk_trig_stock_key"],
    ["tk_trig_draw", "jmp:tk_trig_stock_draw"],
    ["tk_trig_turn", "jmp:tk_trig_stock_turn"],
    ["tk_trig_parameter", "jmp:tk_trig_stock_parameter"],
    # core/keyboard-panel (the KEYBOARD view), core/midi-events (the channel router) and core/fxview (the TRIG picker): 0 is
    # "not the track keyboard's", -1 "no LED of its own"
    ["tk_panel_on", "zero"],
    ["tk_panel_trig_on", "zero"],
    ["tk_panel_off", "zero"],
    ["tk_panel_retrig", "zero"],
    ["tk_panel_cancel", "rts"],
    ["tk_panel_focus", "rts"],
    ["tk_panel_native_record_on", "zero"],
    ["tk_panel_record_audition", "rts"],
    ["tk_capture_panel_press", "rts"],
    ["tk_capture_panel_release", "rts"],
    ["tk_capture_note_list_commit", "rts"],
    ["tk_midi_channel_message", "zero"],
    ["tk_picker_key", "zero"],
    ["tk_picker_led", "minus1"],
]

# The image table `tk_image` of core/track-keyboard (its [[info]]): what the service takes from the image. The service copies it at
# setup (refused without it: E_NO_REGISTRY) and reaches each function through a thunk of its own (a1 is clobbered, as a C call
# may), a data word through TK_DATA(name).
[image]
info = "tk_image"
symbol = "tk_image"
magic = 0x544b5331 # "TKS1"
# the pattern storage, the parameter and seed validators, the pool frame writer and the stock step prologues that stay in the
# image (the boot's project load runs them before a card service is bound), and the runtime and UI functions of the image
functions = [
    "tk_defaults", "tk_track_defaults", "tk_rate_division", "tk_valid", "tk_valid_recipe", "tk_seed_valid", "tk_pattern_seed",
    "tk_get_control", "tk_set_control", "tk_assign_helpers", "tk_set_lock", "tk_clear_lock", "tk_resolve_step",
    "tk_pattern_attach_batch", "tk_pattern_has_track", "tk_pattern_step_attachment",
    "tk_pattern_fw_changed", "tk_pattern_fw_existing", "tk_pattern_fw_get", "tk_pattern_fw_note_step", "tk_pattern_fw_peek",
    "tk_pattern_fw_revision", "tk_pattern_fw_selected", "tk_pattern_fw_track_base",
    "tk_pool_can_start", "tk_pool_capacity", "tk_pool_link_init", "tk_pool_link_quiet", "tk_pool_link_ready",
    "tk_pool_publish_frame", "tk_pool_update",
    "tk_stock_step_copy", "tk_stock_step_paste", "tk_stock_step_clear", "tk_stock_step_toggle", "tk_stock_step_clip_get",
    "dk_ui_core_handle", "dk_ui_core_list_title", "dk_ui_core_menu_front",
    "dkrt_blocks", "dkrt_instrument_type", "dkrt_irq_mask", "dkrt_irq_restore", "dkrt_module", "dkrt_poll_add",
    "pp_current_pattern", "pp_selected_tempo", "pp_transport_running",
]
# functions of other adapters that may be missing from the image (0 then): the moved code tests TK_HAVE(name) before a call.
# CANOPY's host (core/instrument-play, its forwarders into services/instrument.dks) and RELAY's type check (core/relay-track).
optional = [
    "cp_valid", "ilp_event_pair", "instrument_lock_source", "instrument_locked_sound", "instrument_src_track_keyboard",
    "instrument_track_keyboard_lanes", "instrument_track_keyboard_legacy", "instrument_track_keyboard_locked_note",
    "instrument_track_keyboard_controller", "instrument_track_owned", "rtm_is_type",
]
# addresses the moved code reads or compares with: image data, and a forwarder that a firmware table holds (the KEYS refresh
# finds the TRIG view by its vtable draw entry, which is the image forwarder tk_trig_draw)
data = ["pp_position", "tk_trig_draw"]
