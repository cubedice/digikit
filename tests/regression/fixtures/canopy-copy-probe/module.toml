[module]
id = "test/canopy-copy-probe"
version = "0.1.0"
name = "CANOPY Sound copy observation"
category = "test"
type = "framework"
author = "digikit"
status = "experimental"
summary = "Emulator-only global memcpy observation point; never install on hardware."
requires = []
conflicts = []
ports = ["dt2-1.17"]

[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "build/copy-probe.dko.json"
sources = ["src/cf/copy-probe.s"]
place = "cf.expansion"
devices = ["dt2"]

# Replace both complete MOVEA instructions at the stock memcpy entry. The
# trailing NOP occupies the final two bytes displaced by the six-byte jump.
[[op]]
op = "write"
anchor = "cf.machine.site.sound_deserialize"
offset = 0x5afd6
width = 2
value = 0x4ef9
expect_sha256 = "d6f718c1086a221db7b9e2c0bd473331b7546204e6293ab8b774c5c10a0a80e9"
[[op]]
op = "write"
anchor = "cf.machine.site.sound_deserialize"
offset = 0x5afd8
width = 4
value = "canopy_copy_probe_entry"
expect_sha256 = "9a85996715ab5eabc14b0f79d193834ae307c7f99759c1d94ffd00e98c72ce82"
[[op]]
op = "write"
anchor = "cf.machine.site.sound_deserialize"
offset = 0x5afdc
width = 2
value = 0x4e71
expect_sha256 = "b4c43b50bf245bd727623e3c775a8fcfb8d823d00b57dd65f7f79dd33f126315"
